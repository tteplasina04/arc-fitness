services:
  # PostgreSQL Database
  - type: pserv
    name: arc-fitness-db
    env: python
    plan: free
    databaseName: arc_fitness
    databaseUser: arc_user

  # Web Service
  - type: web
    name: arc-fitness
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.yandex.ru
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_EMAIL
        value: admin@arc.fitness
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: INFO
