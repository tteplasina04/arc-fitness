<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Подтверждение email — ARC.FITNESS</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"><script src="/static/js/app.js" defer></script></head><body data-page="verify"><div id="site-header"></div><main class="verify-page"><div class="verify-card"><div class="verify-symbol">✳</div><p class="eyebrow">EMAIL VERIFICATION / 03</p><h1>ПРОВЕРЬ<br><span>СВОЮ ПОЧТУ.</span></h1><p class="muted">Введите email, указанный при регистрации, и шестизначный код. Код действует 10 минут.</p><form id="verify-form"><label>Email<input type="email" name="email" required autocomplete="email" placeholder="name@example.com"></label><label>Код подтверждения<input type="text" name="code" required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000"></label><button class="button button-lime button-full" type="submit">Подтвердить email ↗</button><p class="form-status" aria-live="polite"></p></form></div></main><div id="site-footer"></div></body></html>
