<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Регистрация — ARC.FITNESS</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"><script src="/static/js/app.js" defer></script></head><body data-page="register"><div id="site-header"></div><main class="auth-page"><div class="auth-aside"><div class="auth-brand">ARC<span>.</span>FITNESS</div><p class="eyebrow">BECOME A MEMBER / 02</p><h1>ТВОЙ ПУТЬ<br><span>НАЧИНАЕТСЯ.</span></h1><p>Создай аккаунт, чтобы записываться на тренировки и управлять своими данными.</p><div class="auth-image-slot auth-image-two" role="img" aria-label="Тренировка в фитнес-клубе"></div></div><div class="auth-form-wrap"><form class="auth-form" id="register-form"><p class="eyebrow">СОЗДАЙ АККАУНТ</p><h2>Регистрация</h2><p class="muted">После отправки формы на email придёт шестизначный код.</p><label>Имя и фамилия<input name="full_name" required minlength="2" maxlength="120" autocomplete="name" placeholder="Иван Иванов"></label><label>Email<input name="email" type="email" required autocomplete="email" placeholder="name@example.com"></label><label>Телефон <span class="optional-label">необязательно</span><input name="phone" type="tel" autocomplete="tel" placeholder="+7 ___ ___-__-__"></label><label>Пароль<input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Не менее 8 символов"></label><button class="button button-lime button-full" type="submit">Создать аккаунт <span>↗</span></button><p class="form-status" aria-live="polite"></p><p class="auth-switch">Уже зарегистрированы? <a href="/login">Войти</a></p></form></div></main><div id="site-footer"></div></body></html>
